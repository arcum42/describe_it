            <section class="rounded-2xl border border-stone-800 bg-stone-900 p-5 shadow-2xl shadow-black/20">
              <div class="mb-4 flex items-center justify-between">
                <h2 class="text-lg font-medium">Notes</h2>
                <button @click="refreshNotes()" class="rounded-xl border border-stone-700 px-3 py-2 text-xs uppercase tracking-[0.2em] text-stone-300 hover:border-amber-400 hover:text-amber-200">
                  Refresh
                </button>
              </div>

              <div class="space-y-4">
                <div class="rounded-xl border border-stone-800 bg-stone-950/70 p-3">
                  <div class="flex flex-wrap items-center justify-between gap-3">
                    <div class="inline-flex rounded-xl border border-stone-800 bg-stone-950/80 p-1">
                      <button
                        @click="notes.scope = 'project'; onNotesScopeChanged()"
                        class="rounded-lg px-3 py-2 text-xs font-medium uppercase tracking-[0.2em] transition"
                        :class="notes.scope === 'project' ? 'bg-amber-400 text-stone-950' : 'text-stone-300 hover:text-amber-200'"
                      >
                        Project Notes
                      </button>
                      <button
                        @click="notes.scope = 'global'; onNotesScopeChanged()"
                        class="rounded-lg px-3 py-2 text-xs font-medium uppercase tracking-[0.2em] transition"
                        :class="notes.scope === 'global' ? 'bg-amber-400 text-stone-950' : 'text-stone-300 hover:text-amber-200'"
                      >
                        Global Notes
                      </button>
                    </div>
                    <label class="field-checkbox">
                      <input type="checkbox" x-model="notes.includeArchived" @change="onNotesArchivedFilterChanged()" class="rounded border-stone-700 bg-stone-900 text-amber-400 focus:ring-amber-400" />
                      Include archived
                    </label>
                  </div>
                  <template x-if="notes.scope === 'project' && !currentProject">
                    <p class="mt-3 rounded-xl border border-stone-800 bg-stone-900 px-3 py-2 text-xs text-stone-500">Open a project to view project notes. Global notes remain available.</p>
                  </template>
                </div>

                <div class="grid gap-4 lg:grid-cols-[320px_minmax(0,1fr)]">
                  <div class="rounded-2xl border border-stone-800 bg-stone-950/70 p-4">
                    <div class="mb-3 flex items-center justify-between">
                      <button @click="togglePanel('notesList', true)" class="flex items-center gap-2 text-xs uppercase tracking-[0.2em] text-stone-500 hover:text-amber-200">
                        <span x-text="panelTriangle('notesList', true)"></span>
                        <span>Notes List</span>
                      </button>
                      <button @click="newNoteDraft()" class="rounded-lg border border-stone-700 px-2 py-1 text-[10px] uppercase tracking-[0.2em] text-stone-300 hover:border-amber-400 hover:text-amber-200">
                        New
                      </button>
                    </div>
                    <div x-show="isPanelOpen('notesList', true)" class="space-y-0">
                    <div class="max-h-80 space-y-2 overflow-auto pr-1">
                      <template x-for="note in notesActiveItems()" :key="`${notes.scope}-${note.id}`">
                        <button @click="selectNote(note)" class="block w-full rounded-xl border border-stone-800 bg-stone-900 px-3 py-2 text-left text-sm text-stone-200 hover:border-amber-400/60" :class="notes.selectedNoteId === note.id ? 'border-amber-500 ring-1 ring-amber-500/50' : ''">
                          <div class="flex items-center justify-between gap-2">
                            <p class="truncate font-medium text-stone-100" x-text="note.title || '(untitled note)'"></p>
                            <span x-show="note.is_archived" class="rounded-full border border-stone-700 px-2 py-0.5 text-[10px] uppercase tracking-[0.15em] text-stone-400">archived</span>
                          </div>
                          <p class="mt-1 text-xs text-stone-500" x-text="`${note.format}${note.tags ? ` • ${note.tags}` : ''}`"></p>
                        </button>
                      </template>
                      <template x-if="notesActiveItems().length === 0">
                        <p class="rounded-xl border border-stone-800 bg-stone-900 px-3 py-2 text-sm text-stone-500">No notes in this scope yet.</p>
                      </template>
                    </div>
                    </div>
                  </div>

                  <div class="rounded-2xl border border-stone-800 bg-stone-950/70 p-4">
                    <button @click="togglePanel('notesEditor', true)" class="mb-3 flex items-center gap-2 text-xs uppercase tracking-[0.2em] text-stone-500 hover:text-amber-200">
                      <span x-text="panelTriangle('notesEditor', true)"></span>
                      <span x-text="notes.editor.id ? 'Edit Note' : 'Create Note'"></span>
                    </button>
                    <div x-show="isPanelOpen('notesEditor', true)" class="space-y-0">
                    <div class="grid gap-3 md:grid-cols-2">
                      <label class="block text-xs uppercase tracking-[0.2em] text-stone-500 md:col-span-2">
                        Title
                        <input x-model="notes.editor.title" class="mt-2 w-full rounded-xl border border-stone-800 bg-stone-900 px-3 py-2 text-sm text-stone-200 focus:border-amber-400 focus:outline-none" placeholder="Optional title" />
                      </label>
                      <label class="block text-xs uppercase tracking-[0.2em] text-stone-500">
                        Format
                        <div class="mt-2 select-wrapper">
                          <select x-model="notes.editor.format" class="w-full rounded-xl border border-stone-800 bg-stone-900 px-3 py-2 text-sm text-stone-200 focus:border-amber-400 focus:outline-none">
                            <option value="markdown">Markdown</option>
                            <option value="text">Text</option>
                          </select>
                        </div>
                      </label>
                      <label class="block text-xs uppercase tracking-[0.2em] text-stone-500">
                        Tags
                        <input x-model="notes.editor.tags" class="mt-2 w-full rounded-xl border border-stone-800 bg-stone-900 px-3 py-2 text-sm text-stone-200 focus:border-amber-400 focus:outline-none" placeholder="comma,separated,tags" />
                      </label>
                    </div>
                    <label class="mt-3 block text-xs uppercase tracking-[0.2em] text-stone-500">
                      Content
                      <textarea x-model="notes.editor.content" class="mt-2 min-h-56 w-full rounded-xl border border-stone-800 bg-stone-900 px-3 py-2 text-sm text-stone-200 focus:border-amber-400 focus:outline-none" placeholder="Write note content (text or markdown)"></textarea>
                    </label>
                    <label class="mt-3 field-checkbox">
                      <input type="checkbox" x-model="notes.editor.is_archived" class="rounded border-stone-700 bg-stone-900 text-amber-400 focus:ring-amber-400" />
                      Archived
                    </label>
                    <div class="mt-4 flex flex-wrap gap-3">
                      <button @click="saveNote()" :disabled="isSubmitting || (notes.scope === 'project' && !currentProject)" class="rounded-xl bg-amber-400 px-4 py-2 text-sm font-medium text-stone-950 transition hover:bg-amber-300 disabled:cursor-not-allowed disabled:opacity-60">
                        Save Note
                      </button>
                      <button @click="deleteNote()" :disabled="isSubmitting || !notes.editor.id" class="rounded-xl border border-red-700 px-4 py-2 text-sm font-medium text-red-300 transition hover:border-red-500 hover:text-red-200 disabled:cursor-not-allowed disabled:opacity-60">
                        Delete Note
                      </button>
                      <button @click="newNoteDraft()" :disabled="isSubmitting" class="rounded-xl border border-stone-700 px-4 py-2 text-sm font-medium text-stone-200 transition hover:border-amber-400 hover:text-amber-200 disabled:cursor-not-allowed disabled:opacity-60">
                        New Draft
                      </button>
                    </div>
                    </div>
                  </div>
                </div>

                <div class="rounded-2xl border border-stone-800 bg-stone-950/40 p-4">
                  <div class="mb-3 flex flex-wrap items-center justify-between gap-3">
                    <button @click="togglePanel('notesAssistant', false)" class="flex items-center gap-2 text-left">
                      <span class="text-xs text-stone-500" x-text="panelTriangle('notesAssistant', false)"></span>
                      <div>
                        <p class="text-xs uppercase tracking-[0.2em] text-stone-500">Optional Assistant</p>
                        <p class="text-sm font-medium text-stone-200">LLM Note Assistant</p>
                      </div>
                    </button>
                    <p class="text-xs text-stone-500">Generate draft text from a prompt, then save as a note.</p>
                  </div>
                  <div x-show="isPanelOpen('notesAssistant', false)" class="space-y-0">

                  <div class="grid gap-3 md:grid-cols-2 lg:grid-cols-3">
                    <label class="block text-xs uppercase tracking-[0.2em] text-stone-500">
                      Backend
                      <div class="mt-2 select-wrapper">
                        <select x-model="notes.llm.backend" @change="onNotesLLMBackendChanged()" class="w-full rounded-xl border border-stone-800 bg-stone-900 px-3 py-2 text-sm text-stone-200 focus:border-amber-400 focus:outline-none">
                          <template x-for="backend in llm.backends.filter((item) => item.available)" :key="`notes-llm-backend-${backend.name}`">
                            <option :value="backend.name" x-text="backend.name"></option>
                          </template>
                        </select>
                      </div>
                    </label>
                    <label class="block text-xs uppercase tracking-[0.2em] text-stone-500">
                      Model
                      <div class="mt-2 select-wrapper">
                        <select x-model="notes.llm.model" class="w-full rounded-xl border border-stone-800 bg-stone-900 px-3 py-2 text-sm text-stone-200 focus:border-amber-400 focus:outline-none">
                          <template x-for="modelInfo in availableModelsForNoteLLM()" :key="`notes-llm-model-${modelInfo.name}`">
                            <option :value="modelInfo.name" x-text="modelOptionLabel(modelInfo)"></option>
                          </template>
                        </select>
                      </div>
                    </label>
                    <label class="block text-xs uppercase tracking-[0.2em] text-stone-500">
                      Save Format
                      <div class="mt-2 select-wrapper">
                        <select x-model="notes.llm.outputFormat" class="w-full rounded-xl border border-stone-800 bg-stone-900 px-3 py-2 text-sm text-stone-200 focus:border-amber-400 focus:outline-none">
                          <option value="markdown">Markdown</option>
                          <option value="text">Text</option>
                        </select>
                      </div>
                    </label>
                  </div>

                  <label class="mt-3 block text-xs uppercase tracking-[0.2em] text-stone-500">
                    Prompt
                    <textarea x-model="notes.llm.prompt" class="mt-2 min-h-32 w-full rounded-xl border border-stone-800 bg-stone-900 px-3 py-2 text-sm text-stone-200 focus:border-amber-400 focus:outline-none" placeholder="Ask for a reusable style guide, taxonomy summary, cleanup checklist, prompt template, etc."></textarea>
                  </label>

                  <div class="mt-3 grid gap-3 md:grid-cols-2">
                    <label class="block text-xs uppercase tracking-[0.2em] text-stone-500">
                      New Note Title (optional)
                      <input x-model="notes.llm.title" class="mt-2 w-full rounded-xl border border-stone-800 bg-stone-900 px-3 py-2 text-sm text-stone-200 focus:border-amber-400 focus:outline-none" placeholder="Auto-derived from prompt if blank" />
                    </label>
                    <label class="block text-xs uppercase tracking-[0.2em] text-stone-500">
                      New Note Tags (optional)
                      <input x-model="notes.llm.tags" class="mt-2 w-full rounded-xl border border-stone-800 bg-stone-900 px-3 py-2 text-sm text-stone-200 focus:border-amber-400 focus:outline-none" placeholder="workflow,style,reference" />
                    </label>
                  </div>

                  <div class="mt-3 grid gap-3 md:grid-cols-2">
                    <label class="block text-xs uppercase tracking-[0.2em] text-stone-500">
                      Context URL (optional)
                      <input x-model="notes.llm.contextUrl" class="mt-2 w-full rounded-xl border border-stone-800 bg-stone-900 px-3 py-2 text-sm text-stone-200 focus:border-amber-400 focus:outline-none" placeholder="https://example.com/reference" />
                    </label>
                    <label class="block text-xs uppercase tracking-[0.2em] text-stone-500">
                      Context File (optional)
                      <div class="mt-2 flex items-center gap-2">
                        <input x-model="notes.llm.contextFile" class="min-w-0 flex-1 rounded-xl border border-stone-800 bg-stone-900 px-3 py-2 text-sm text-stone-200 focus:border-amber-400 focus:outline-none" placeholder="/path/to/context.txt" />
                        <button @click="openPathPicker('notes_context_file')" class="shrink-0 rounded-xl border border-stone-700 px-3 py-2 text-[10px] uppercase tracking-[0.2em] text-stone-300 hover:border-amber-400 hover:text-amber-200">
                          <span>Browse</span>
                          <span class="ml-1 text-[9px] normal-case tracking-normal text-stone-500" x-text="browsePickerModeLabel()"></span>
                        </button>
                      </div>
                    </label>
                  </div>

                  <div class="mt-3 grid gap-2 md:grid-cols-2 lg:grid-cols-3">
                    <label class="field-checkbox">
                      <input type="checkbox" x-model="notes.llm.webSearch" class="rounded border-stone-700 bg-stone-900 text-amber-400 focus:ring-amber-400" />
                      Enable web_search tool
                    </label>
                    <label class="field-checkbox">
                      <input type="checkbox" x-model="notes.llm.webFetch" class="rounded border-stone-700 bg-stone-900 text-amber-400 focus:ring-amber-400" />
                      Enable web_fetch tool
                    </label>
                    <label class="field-checkbox">
                      <input type="checkbox" x-model="notes.llm.includeProjectNotes" :disabled="!currentProject" class="rounded border-stone-700 bg-stone-900 text-amber-400 focus:ring-amber-400 disabled:opacity-60" />
                      Include project notes context
                    </label>
                    <label class="field-checkbox">
                      <input type="checkbox" x-model="notes.llm.includeGlobalNotes" class="rounded border-stone-700 bg-stone-900 text-amber-400 focus:ring-amber-400" />
                      Include global notes context
                    </label>
                    <label class="field-checkbox md:col-span-2 lg:col-span-2">
                      <input type="checkbox" x-model="notes.llm.useSelectedImage" :disabled="!selectedImage" class="rounded border-stone-700 bg-stone-900 text-amber-400 focus:ring-amber-400 disabled:opacity-60" />
                      Attach selected image from Editor tab (optional)
                    </label>
                  </div>
                  <div class="mt-3 grid gap-3 md:grid-cols-2">
                    <label class="block text-xs uppercase tracking-[0.2em] text-stone-500">
                      Reasoning
                      <div class="mt-2 select-wrapper">
                        <select x-model="notes.llm.reasoningMode" class="w-full rounded-xl border border-stone-800 bg-stone-900 px-3 py-2 text-sm text-stone-200 focus:border-amber-400 focus:outline-none">
                          <option value="off">Off</option>
                          <option value="on">On (auto)</option>
                          <option value="low">Low</option>
                          <option value="medium">Medium</option>
                          <option value="high">High</option>
                        </select>
                      </div>
                    </label>
                    <label class="block text-xs uppercase tracking-[0.2em] text-stone-500">
                      Reasoning Output
                      <div class="mt-2 select-wrapper">
                        <select x-model="notes.llm.reasoningVisibility" class="w-full rounded-xl border border-stone-800 bg-stone-900 px-3 py-2 text-sm text-stone-200 focus:border-amber-400 focus:outline-none">
                          <option value="hidden">Hide reasoning text</option>
                          <option value="blockquote">Show as blockquote</option>
                          <option value="code">Show as code block</option>
                        </select>
                      </div>
                    </label>
                  </div>
                  <template x-if="notes.llm.useSelectedImage && selectedImage">
                    <p class="mt-2 text-xs text-stone-500" x-text="`Image context: ${selectedImage.filename}`"></p>
                  </template>

                  <div class="mt-4 flex flex-wrap gap-3">
                    <button @click="generateNoteWithLLM(false)" :disabled="isSubmitting || !notes.llm.backend || !notes.llm.model" class="rounded-xl border border-stone-700 px-4 py-2 text-sm font-medium text-stone-200 transition hover:border-amber-400 hover:text-amber-200 disabled:cursor-not-allowed disabled:opacity-60">
                      Generate Draft
                    </button>
                    <button @click="generateNoteWithLLM(true)" :disabled="isSubmitting || !notes.llm.backend || !notes.llm.model" class="rounded-xl bg-stone-200 px-4 py-2 text-sm font-medium text-stone-950 transition hover:bg-stone-100 disabled:cursor-not-allowed disabled:opacity-60">
                      Generate + Save New Note
                    </button>
                  </div>
                  </div>
                </div>
              </div>
            </section>
