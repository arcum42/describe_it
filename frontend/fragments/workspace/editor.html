                    <div class="mb-3 flex items-center justify-between gap-3">
                      <button
                        @click="togglePanel('editorBatchReplace', false)"
                        class="flex items-center gap-2 text-left"
                      >
                        <span class="text-xs text-stone-500" x-text="panelTriangle('editorBatchReplace', false)"></span>
                        <div>
                          <p class="text-sm font-medium text-stone-200">Batch Caption Replace</p>
                          <p class="text-xs text-stone-500">Preview and apply find/replace with undo support.</p>
                        </div>
                      </button>
                      <button @click="loadCaptionBatchOperations()" :disabled="isSubmitting" class="rounded-lg border border-stone-700 px-2 py-1 text-[11px] text-stone-300 hover:border-amber-400 hover:text-amber-200 disabled:cursor-not-allowed disabled:opacity-60">
                        Refresh History
                      </button>
                    </div>

                    <div x-show="isPanelOpen('editorBatchReplace', false)" class="space-y-0">

                    <div class="grid gap-3 md:grid-cols-2">
                      <label class="block text-xs uppercase tracking-[0.2em] text-stone-500">
                        Find Text
                        <input x-model="captionBatch.query.findText" class="mt-2 w-full rounded-xl border border-stone-800 bg-stone-900 px-3 py-2 text-sm text-stone-200 focus:border-amber-400 focus:outline-none" placeholder="Text or regex pattern" />
                      </label>
                      <label class="block text-xs uppercase tracking-[0.2em] text-stone-500">
                        Replace With
                        <input x-model="captionBatch.query.replaceText" class="mt-2 w-full rounded-xl border border-stone-800 bg-stone-900 px-3 py-2 text-sm text-stone-200 focus:border-amber-400 focus:outline-none" placeholder="Replacement text" />
                      </label>
                    </div>

                    <div class="mt-3 grid gap-3 md:grid-cols-3">
                      <label class="block text-xs uppercase tracking-[0.2em] text-stone-500">
                        Query Mode
                        <div class="mt-2 select-wrapper">
                          <select x-model="captionBatch.query.mode" class="w-full rounded-xl border border-stone-800 bg-stone-900 px-3 py-2 text-sm text-stone-200 focus:border-amber-400 focus:outline-none">
                            <option value="plain">plain</option>
                            <option value="regex">regex</option>
                          </select>
                        </div>
                      </label>
                      <label class="block text-xs uppercase tracking-[0.2em] text-stone-500">
                        Caption Scope
                        <div class="mt-2 select-wrapper">
                          <select x-model="captionBatch.scope.captionScope" class="w-full rounded-xl border border-stone-800 bg-stone-900 px-3 py-2 text-sm text-stone-200 focus:border-amber-400 focus:outline-none">
                            <option value="active_only">active only</option>
                            <option value="all_candidates">all candidates</option>
                          </select>
                        </div>
                      </label>
                      <label class="block text-xs uppercase tracking-[0.2em] text-stone-500">
                        Image Scope
                        <div class="mt-2 select-wrapper">
                          <select x-model="captionBatch.scope.imageScope" class="w-full rounded-xl border border-stone-800 bg-stone-900 px-3 py-2 text-sm text-stone-200 focus:border-amber-400 focus:outline-none">
                            <option value="included_only">included only</option>
                            <option value="all">all images</option>
                            <option value="selected_ids">selected IDs</option>
                          </select>
                        </div>
                      </label>
                    </div>

                    <label x-show="captionBatch.scope.imageScope === 'selected_ids'" class="mt-3 block text-xs uppercase tracking-[0.2em] text-stone-500">
                      Selected Image IDs (comma or space separated)
                      <input x-model="captionBatch.scope.imageIdsText" class="mt-2 w-full rounded-xl border border-stone-800 bg-stone-900 px-3 py-2 text-sm text-stone-200 focus:border-amber-400 focus:outline-none" placeholder="Example: 12, 18, 42" />
                    </label>

                    <div class="mt-3 flex flex-wrap items-center gap-3 text-xs text-stone-400">
                      <label class="field-checkbox">
                        <input type="checkbox" x-model="captionBatch.query.caseSensitive" class="rounded border-stone-700 bg-stone-900 text-amber-400 focus:ring-amber-400" />
                        Case sensitive
                      </label>
                      <label class="field-checkbox">
                        <input type="checkbox" x-model="captionBatch.apply.createUndoSnapshot" class="rounded border-stone-700 bg-stone-900 text-amber-400 focus:ring-amber-400" />
                        Create undo snapshot
                      </label>
                      <label class="field-checkbox">
                        <input type="checkbox" x-model="captionBatch.apply.confirm" class="rounded border-stone-700 bg-stone-900 text-amber-400 focus:ring-amber-400" />
                        Confirm apply
                      </label>
                    </div>

                    <p x-show="!captionBatchValidation().ok" class="mt-2 text-xs text-red-300" x-text="captionBatchValidation().message"></p>

                    <div class="mt-3 flex flex-wrap gap-2">
                      <button @click="previewCaptionBatchReplace()" :disabled="isSubmitting || !captionBatchValidation().ok" class="rounded-xl border border-stone-700 px-3 py-2 text-xs text-stone-200 hover:border-amber-400 hover:text-amber-200 disabled:cursor-not-allowed disabled:opacity-60">
                        Preview Replace
                      </button>
                      <button @click="applyCaptionBatchReplace()" :disabled="isSubmitting || !captionBatch.preview || !captionBatch.apply.confirm" class="rounded-xl bg-amber-400 px-3 py-2 text-xs font-medium text-stone-950 hover:bg-amber-300 disabled:cursor-not-allowed disabled:opacity-60">
                        Apply Replace
                      </button>
                      <button @click="undoCaptionBatchReplace()" :disabled="isSubmitting" class="rounded-xl border border-red-700 px-3 py-2 text-xs text-red-300 hover:border-red-500 hover:text-red-200 disabled:cursor-not-allowed disabled:opacity-60">
                        Undo Latest
                      </button>
                      <button @click="clearCaptionBatchPreview()" :disabled="isSubmitting || !captionBatch.preview" class="rounded-xl border border-stone-700 px-3 py-2 text-xs text-stone-300 hover:border-stone-500 hover:text-stone-100 disabled:cursor-not-allowed disabled:opacity-60">
                        Clear Preview
                      </button>
                    </div>

                    <div x-show="captionBatch.preview" class="mt-4 rounded-xl border border-stone-800 bg-stone-900/80 p-3">
                      <p class="text-xs uppercase tracking-[0.2em] text-stone-500">Preview Summary</p>
                      <p class="mt-1 text-sm text-stone-200" x-text="`${captionBatch.preview?.impacted_captions_count || 0} captions across ${captionBatch.preview?.impacted_images_count || 0} images`"></p>
                      <p class="mt-1 text-xs text-stone-500" x-text="captionBatch.preview?.expires_at ? `Expires: ${captionBatch.preview.expires_at}` : ''"></p>

                      <template x-if="(captionBatch.preview?.warnings || []).length > 0">
                        <div class="mt-2 rounded-lg border border-amber-900 bg-amber-950/40 px-2 py-1 text-xs text-amber-200">
                          <template x-for="warning in captionBatch.preview.warnings" :key="warning">
                            <p x-text="warning"></p>
                          </template>
                        </div>
                      </template>

                      <div class="mt-3 max-h-40 space-y-2 overflow-auto pr-1">
                        <template x-for="sample in (captionBatch.preview?.sample_changes || [])" :key="`${sample.caption_id}-${sample.image_id}`">
                          <div class="rounded-lg border border-stone-800 bg-stone-950 px-2 py-2 text-xs text-stone-300">
                            <p class="text-[10px] uppercase tracking-[0.15em] text-stone-500" x-text="`image ${sample.image_id} • caption ${sample.caption_id}`"></p>
                            <p class="mt-1 text-stone-400" x-text="`Before: ${sample.before_preview}`"></p>
                            <p class="mt-1 text-stone-200" x-text="`After: ${sample.after_preview}`"></p>
                          </div>
                        </template>
                      </div>
                    </div>

                    <div class="mt-4 rounded-xl border border-stone-800 bg-stone-900/80 p-3">
                      <p class="text-xs uppercase tracking-[0.2em] text-stone-500">Operation History</p>
                      <div class="mt-2 max-h-44 space-y-2 overflow-auto pr-1">
                        <template x-for="op in captionBatch.operations" :key="op.operation_id">
                          <div class="rounded-lg border border-stone-800 bg-stone-950 px-2 py-2 text-xs text-stone-300">
                            <div class="flex flex-wrap items-center justify-between gap-2">
                              <p class="text-stone-200" x-text="`${op.type} • ${op.impacted_captions_count} captions / ${op.impacted_images_count} images`"></p>
                              <button @click="undoCaptionBatchReplace(op.operation_id)" :disabled="isSubmitting || !!op.undone_at" class="rounded-lg border border-red-700 px-2 py-1 text-[10px] text-red-300 hover:border-red-500 hover:text-red-200 disabled:cursor-not-allowed disabled:opacity-60">
                                Undo
                              </button>
                            </div>
                            <p class="mt-1 text-[10px] uppercase tracking-[0.15em] text-stone-500" x-text="`operation ${op.operation_id}`"></p>
                            <p class="mt-1 text-stone-500" x-text="`Created: ${op.created_at}`"></p>
                            <p class="mt-1 text-stone-500" x-text="op.undone_at ? `Undone: ${op.undone_at}` : 'Undone: no'"></p>
                          </div>
                        </template>
                        <template x-if="captionBatch.operations.length === 0">
                          <p class="rounded-lg border border-stone-800 bg-stone-950 px-2 py-2 text-xs text-stone-500">No batch operations yet.</p>
                        </template>
                      </div>
                    </div>
                    </div>
                  </div>
                </div>
              </template>
              <template x-if="!selectedImage">
                <div class="rounded-2xl border border-dashed border-stone-700 bg-stone-950/70 px-4 py-8 text-center text-sm text-stone-500">
                  Select an image from the grid tab to start editing captions.
                </div>
              </template>
                </section>
              </template>
