            <section class="rounded-2xl border border-stone-800 bg-stone-900 p-5 shadow-2xl shadow-black/20">
              <div class="mb-4 flex items-center justify-between">
                <h2 class="text-lg font-medium">Imageboard Credentials</h2>
                <button @click="loadImageboardSettings()" class="rounded-xl border border-stone-700 px-3 py-2 text-xs uppercase tracking-[0.2em] text-stone-300 hover:border-amber-400 hover:text-amber-200">
                  Refresh
                </button>
              </div>

              <div class="space-y-4">
                <div class="rounded-xl border border-stone-800 bg-stone-950/70 px-4 py-3 text-xs text-stone-500">
                  Manage API credentials for imageboard services. Keep your API keys secure and never share them.
                </div>

                <template x-if="imageboards && imageboards.boards && imageboards.boards.length > 0">
                  <div class="space-y-3">
                    <template x-for="board in imageboards.boards" :key="board.board_id">
                      <div class="rounded-xl border border-stone-800 bg-stone-950/70 p-4">
                        <div class="mb-3 flex items-center justify-between">
                          <div>
                            <p class="font-semibold text-stone-100" x-text="board.display_name"></p>
                            <p class="text-xs text-stone-500" x-text="board.base_url"></p>
                          </div>
                          <template x-if="imageboards.credentials">
                            <template x-if="imageboards.credentials.find(c => c.board_id === board.board_id && c.has_key)">
                              <span class="rounded-full bg-green-900/30 px-2 py-1 text-xs text-green-300">Configured</span>
                            </template>
                            <template x-if="!imageboards.credentials.find(c => c.board_id === board.board_id && c.has_key)">
                              <span class="rounded-full bg-stone-800/50 px-2 py-1 text-xs text-stone-400">Not configured</span>
                            </template>
                          </template>
                        </div>

                        <form @submit.prevent="saveImageboardCredential(board.board_id)" class="space-y-3">
                          <div>
                            <label class="block text-xs font-medium text-stone-400 mb-1">API Key</label>
                            <input
                              type="password"
                              x-model="imageboards.forms[board.board_id].apiKey"
                              placeholder="Enter API key"
                              class="w-full rounded-lg border border-stone-700 bg-stone-950 px-3 py-2 text-sm text-stone-100 placeholder-stone-600 focus:border-amber-500 focus:outline-none"
                            />
                          </div>

                          <template x-if="board.requires_username">
                            <div>
                              <label class="block text-xs font-medium text-stone-400 mb-1">Username</label>
                              <input
                                type="text"
                                x-model="imageboards.forms[board.board_id].username"
                                placeholder="Enter username"
                                class="w-full rounded-lg border border-stone-700 bg-stone-950 px-3 py-2 text-sm text-stone-100 placeholder-stone-600 focus:border-amber-500 focus:outline-none"
                              />
                            </div>
                          </template>

                          <div class="flex gap-2">
                            <button
                              type="submit"
                              class="flex-1 rounded-lg bg-amber-400 px-3 py-2 text-sm font-medium text-stone-950 transition hover:bg-amber-300"
                            >
                              Save
                            </button>
                            <template x-if="imageboards.credentials.find(c => c.board_id === board.board_id && c.has_key)">
                              <button
                                type="button"
                                @click="deleteImageboardCredential(board.board_id)"
                                class="flex-1 rounded-lg border border-red-700 px-3 py-2 text-sm font-medium text-red-300 transition hover:bg-red-900/20"
                              >
                                Remove
                              </button>
                            </template>
                          </div>
                        </form>
                      </div>
                    </template>
                  </div>
                </template>

                <template x-if="!imageboards || !imageboards.boards || imageboards.boards.length === 0">
                  <div class="rounded-xl border border-stone-800 bg-stone-950/70 px-4 py-3 text-sm text-stone-500">
                    No imageboard services available. Check server configuration.
                  </div>
                </template>

                <template x-if="statusMessage && settingsTab === 'imageboards'">
                  <div class="rounded-xl border border-green-700 bg-green-900/20 px-4 py-3 text-sm text-green-300" x-text="statusMessage"></div>
                </template>
                <template x-if="errorMessage && settingsTab === 'imageboards'">
                  <div class="rounded-xl border border-red-700 bg-red-900/20 px-4 py-3 text-sm text-red-300" x-text="errorMessage"></div>
                </template>
              </div>
            </section>
